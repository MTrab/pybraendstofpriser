[tool.poetry]
name = "pybraendstofpriser"
version = "0.0.1"
description = "Library for fetching/scraping Danish fuel prices"
authors = ["Malene Trab <malene@trab.dk>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
beautifulsoup4 = "^4.14.3"
aiohttp = "^3.13.2"
pandas = ">=2.3.3,<4.0.0"
openpyxl = "^3.1.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.15.1"
xlrd = "^2.0.2"
lxml = "^6.0.2"
openpyxl = "^3.1.5"
pandas = ">=2.3.3,<4.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that fetch real data from external websites",
]